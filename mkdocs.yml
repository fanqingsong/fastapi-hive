site_name: FastAPI Hive
site_description: FastAPI Hive Framework, modulization code layout tools, decoupling codes into cornerstones and endpoints, developer-friendly, easy to be integrated.
site_url: https://fanqingsong.github.io/fastapi-hive
theme:
  name: material
repo_name: fanqingsong/fastapi-hive
repo_url: https://github.com/fanqingsong/fastapi-hive
nav:
- index.md
- why.md
- how.md
- design.md
- usecases.md
- reference.md
- model_description.md
markdown_extensions:
- toc:
    permalink: true
- tables
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format



