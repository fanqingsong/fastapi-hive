<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">FastAPI Hive architecture</title>
  <desc id="desc">The IoC framework discovers foundations and endpoint packages, runs hooks, exposes state, and mounts routers into FastAPI.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef8f7"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1200" height="620" rx="24" fill="#f1f8f7"/>
  <text x="600" y="46" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="25" font-weight="750" fill="#0f172a">FastAPI Hive architecture</text>
  <text x="600" y="74" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="15" fill="#64748b">Convention-based modules connected by discovery, hooks, state, and router mounting</text>

  <g transform="translate(56 106)" filter="url(#shadow)">
    <rect width="310" height="392" rx="20" fill="#fff" stroke="#2dd4bf" stroke-width="2"/>
    <rect width="310" height="70" rx="20" fill="#ccfbf1"/>
    <path d="M0 50h310v20H0Z" fill="#ccfbf1"/>
    <circle cx="38" cy="35" r="16" fill="#14b8a6"/>
    <path d="M30 35h16M38 27v16" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="66" y="42" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="750" fill="#134e4a">Foundations</text>
    <text x="24" y="102" font-family="Inter,Segoe UI,sans-serif" font-size="14" fill="#64748b">Shared application capabilities</text>

    <g transform="translate(24 126)">
      <rect width="262" height="68" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
      <circle cx="31" cy="34" r="15" fill="#5eead4"/>
      <path d="M25 34a6 6 0 1 1 12 0v7H25Zm3-5v-3a3 3 0 0 1 6 0v3" fill="none" stroke="#134e4a" stroke-width="2"/>
      <text x="58" y="31" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#134e4a">Authentication</text>
      <text x="58" y="51" font-family="Inter,Segoe UI,sans-serif" font-size="13" fill="#64748b">validation and identity</text>
    </g>

    <g transform="translate(24 210)">
      <rect width="262" height="68" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
      <ellipse cx="31" cy="25" rx="14" ry="7" fill="none" stroke="#0f766e" stroke-width="2"/>
      <path d="M17 25v18c0 4 6 7 14 7s14-3 14-7V25M17 34c0 4 6 7 14 7s14-3 14-7" fill="none" stroke="#0f766e" stroke-width="2"/>
      <text x="58" y="31" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#134e4a">Database</text>
      <text x="58" y="51" font-family="Inter,Segoe UI,sans-serif" font-size="13" fill="#64748b">connection and sessions</text>
    </g>

    <g transform="translate(24 294)">
      <rect width="262" height="68" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
      <path d="m31 18 5 10 11 2-8 8 2 11-10-5-10 5 2-11-8-8 11-2Z" fill="#2dd4bf"/>
      <text x="58" y="31" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#134e4a">Shared services</text>
      <text x="58" y="51" font-family="Inter,Segoe UI,sans-serif" font-size="13" fill="#64748b">logging, cache, integrations</text>
    </g>
  </g>

  <g transform="translate(445 106)" filter="url(#shadow)">
    <rect width="310" height="392" rx="20" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
    <rect width="310" height="70" rx="20" fill="#fef3c7"/>
    <path d="M0 50h310v20H0Z" fill="#fef3c7"/>
    <path d="m38 18 16 9v18l-16 9-16-9V27Z" fill="#f59e0b"/>
    <text x="66" y="42" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="750" fill="#78350f">Endpoint packages</text>
    <text x="24" y="102" font-family="Inter,Segoe UI,sans-serif" font-size="14" fill="#64748b">Self-contained business capabilities</text>

    <g transform="translate(24 126)">
      <rect width="262" height="100" rx="12" fill="#fffbeb" stroke="#fde68a"/>
      <text x="18" y="29" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#78350f">heartbeat/</text>
      <g font-family="ui-monospace,SFMono-Regular,monospace" font-size="13" fill="#92400e">
        <text x="32" y="54">router/</text>
        <text x="113" y="54">schema/</text>
        <text x="194" y="54">service/</text>
        <text x="32" y="79">__init__.py - lifecycle hooks</text>
      </g>
    </g>

    <g transform="translate(24 242)">
      <rect width="262" height="100" rx="12" fill="#fffbeb" stroke="#fde68a"/>
      <text x="18" y="29" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#78350f">house_price/</text>
      <g font-family="ui-monospace,SFMono-Regular,monospace" font-size="13" fill="#92400e">
        <text x="32" y="54">router/</text>
        <text x="113" y="54">schema/</text>
        <text x="194" y="54">service/</text>
        <text x="32" y="79">db/ | config.py | __init__.py</text>
      </g>
    </g>
  </g>

  <g transform="translate(834 106)" filter="url(#shadow)">
    <rect width="310" height="392" rx="20" fill="#fff" stroke="#10b981" stroke-width="2"/>
    <rect width="310" height="70" rx="20" fill="#d1fae5"/>
    <path d="M0 50h310v20H0Z" fill="#d1fae5"/>
    <circle cx="38" cy="35" r="17" fill="#10b981"/>
    <path d="M28 35h20M38 25v20" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="66" y="42" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="750" fill="#064e3b">FastAPI app</text>

    <g transform="translate(24 100)">
      <rect width="262" height="58" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
      <text x="18" y="25" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#065f46">Mounted routers</text>
      <text x="18" y="44" font-family="Inter,Segoe UI,sans-serif" font-size="12.5" fill="#64748b">URL prefixes + OpenAPI tags</text>
    </g>
    <g transform="translate(24 174)">
      <rect width="262" height="58" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
      <text x="18" y="25" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#065f46">Application state</text>
      <text x="18" y="44" font-family="Inter,Segoe UI,sans-serif" font-size="12.5" fill="#64748b">foundations + endpoints</text>
    </g>
    <g transform="translate(24 248)">
      <rect width="262" height="58" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
      <text x="18" y="25" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#065f46">Request middleware</text>
      <text x="18" y="44" font-family="Inter,Segoe UI,sans-serif" font-size="12.5" fill="#64748b">before / after request hooks</text>
    </g>
  </g>

  <path d="M366 302h70" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M755 302h70" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g transform="translate(255 538)">
    <rect width="690" height="54" rx="27" fill="#0f2933"/>
    <text x="345" y="23" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#fbbf24">IoCFramework</text>
    <text x="345" y="42" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="13" fill="#cbd5e1">discover modules | invoke hooks | expose state | mount routers</text>
  </g>
  <path d="M410 538v-22" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M600 538v-22" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M790 538v-22" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
