<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">FastAPI Hive concept</title>
  <desc id="desc">Shared cornerstones support self-contained business endpoints inside a FastAPI application.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081f2c"/>
      <stop offset="1" stop-color="#103d45"/>
    </linearGradient>
    <linearGradient id="honey" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".25"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#background)"/>
  <circle cx="1070" cy="70" r="145" fill="#22c55e" opacity=".06"/>
  <circle cx="1070" cy="390" r="210" fill="#06b6d4" opacity=".06"/>

  <g transform="translate(105 42)" filter="url(#shadow)">
    <path d="M150 0 280 75v150l-130 75L20 225V75Z" fill="url(#honey)"/>
    <path d="M150 32 252 91v118l-102 59-102-59V91Z" fill="#fff7d6" opacity=".2"/>
    <text x="150" y="126" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="25" font-weight="700" fill="#3d2a00">FASTAPI</text>
    <text x="150" y="177" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="47" font-weight="800" fill="#17232b">HIVE</text>
    <text x="150" y="212" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="600" letter-spacing="2" fill="#5c4500">MODULAR BY DESIGN</text>
  </g>

  <g transform="translate(450 56)">
    <text x="0" y="34" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700" letter-spacing="2.5" fill="#fbbf24">BUILD A MODULAR API</text>
    <text x="0" y="91" font-family="Inter,Segoe UI,sans-serif" font-size="40" font-weight="750" fill="#f8fafc">Business capabilities stay together.</text>
    <text x="0" y="129" font-family="Inter,Segoe UI,sans-serif" font-size="19" fill="#b9d2d8">Automatic discovery, lifecycle hooks, and router mounting</text>
    <text x="0" y="158" font-family="Inter,Segoe UI,sans-serif" font-size="19" fill="#b9d2d8">connect every module to your FastAPI application.</text>

    <g transform="translate(0 202)">
      <rect width="202" height="96" rx="16" fill="#133a44" stroke="#2dd4bf" stroke-width="1.5"/>
      <circle cx="32" cy="31" r="13" fill="#2dd4bf"/>
      <path d="M26 31h12M32 25v12" stroke="#073b3a" stroke-width="2.5" stroke-linecap="round"/>
      <text x="55" y="37" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#ecfeff">Cornerstones</text>
      <text x="20" y="69" font-family="Inter,Segoe UI,sans-serif" font-size="14" fill="#a8cbd1">Auth | DB | shared tools</text>
    </g>

    <path d="M220 250h50" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round"/>
    <path d="m263 243 9 7-9 7" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(288 202)">
      <rect width="202" height="96" rx="16" fill="#133a44" stroke="#fbbf24" stroke-width="1.5"/>
      <path d="m32 17 14 8v16l-14 8-14-8V25Z" fill="#fbbf24"/>
      <text x="55" y="37" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#fffbeb">Endpoints</text>
      <text x="20" y="69" font-family="Inter,Segoe UI,sans-serif" font-size="14" fill="#a8cbd1">Router | schema | service</text>
    </g>

    <path d="M508 250h50" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round"/>
    <path d="m551 243 9 7-9 7" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(576 202)">
      <rect width="134" height="96" rx="16" fill="#10b981" opacity=".95"/>
      <path d="M25 31h23M37 20v22" stroke="#063e36" stroke-width="3" stroke-linecap="round"/>
      <text x="60" y="37" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="750" fill="#052e2b">FastAPI</text>
      <text x="20" y="69" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#064e3b">One application</text>
    </g>
  </g>
</svg>
