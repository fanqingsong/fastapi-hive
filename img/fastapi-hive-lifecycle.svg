<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">FastAPI Hive lifecycle</title>
  <desc id="desc">Startup initializes foundations and endpoints, request middleware invokes per-request hooks, and shutdown tears resources down.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2530"/>
      <stop offset="1" stop-color="#103d45"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#7dd3fc"/>
    </marker>
  </defs>

  <rect width="1200" height="500" rx="24" fill="url(#bg)"/>
  <text x="600" y="47" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="25" font-weight="750" fill="#f8fafc">Application and request lifecycle</text>
  <text x="600" y="74" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="15" fill="#a8cbd1">The same module boundary controls initialization, request resources, and cleanup</text>

  <g transform="translate(55 108)">
    <rect width="300" height="306" rx="18" fill="#fff" opacity=".97"/>
    <circle cx="40" cy="40" r="22" fill="#f59e0b"/>
    <text x="40" y="47" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="800" fill="#fff">1</text>
    <text x="75" y="47" font-family="Inter,Segoe UI,sans-serif" font-size="21" font-weight="750" fill="#78350f">Startup</text>
    <text x="24" y="83" font-family="Inter,Segoe UI,sans-serif" font-size="13" fill="#64748b">Discover modules and prepare resources once.</text>

    <g font-family="Inter,Segoe UI,sans-serif" font-size="14">
      <rect x="24" y="108" width="252" height="38" rx="9" fill="#fffbeb" stroke="#fde68a"/>
      <text x="42" y="133" fill="#92400e">External pre-startup</text>
      <path d="M150 146v15" stroke="#94a3b8" marker-end="url(#arrow)"/>
      <rect x="24" y="164" width="252" height="38" rx="9" fill="#f0fdfa" stroke="#99f6e4"/>
      <text x="42" y="189" fill="#115e59">Foundation pre-startup</text>
      <path d="M150 202v15" stroke="#94a3b8" marker-end="url(#arrow)"/>
      <rect x="24" y="220" width="252" height="38" rx="9" fill="#fffbeb" stroke="#fde68a"/>
      <text x="42" y="245" fill="#92400e">Endpoint startup + mount routers</text>
      <path d="M150 258v15" stroke="#94a3b8" marker-end="url(#arrow)"/>
      <text x="150" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">then post-startup hooks</text>
    </g>
  </g>

  <path d="M370 261h45" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(435 108)">
    <rect width="330" height="306" rx="18" fill="#fff" opacity=".97"/>
    <circle cx="40" cy="40" r="22" fill="#14b8a6"/>
    <text x="40" y="47" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="800" fill="#fff">2</text>
    <text x="75" y="47" font-family="Inter,Segoe UI,sans-serif" font-size="21" font-weight="750" fill="#134e4a">Each request</text>
    <text x="24" y="83" font-family="Inter,Segoe UI,sans-serif" font-size="13" fill="#64748b">Attach request state and wrap route execution.</text>

    <g font-family="Inter,Segoe UI,sans-serif" font-size="14">
      <rect x="24" y="108" width="282" height="38" rx="9" fill="#f0fdfa" stroke="#99f6e4"/>
      <text x="42" y="133" fill="#115e59">Foundation pre-call hooks</text>
      <path d="M165 146v15" stroke="#94a3b8" marker-end="url(#arrow)"/>
      <rect x="24" y="164" width="282" height="38" rx="9" fill="#ecfeff" stroke="#a5f3fc"/>
      <text x="42" y="189" fill="#155e75">FastAPI endpoint execution</text>
      <path d="M165 202v15" stroke="#94a3b8" marker-end="url(#arrow)"/>
      <rect x="24" y="220" width="282" height="38" rx="9" fill="#f0fdfa" stroke="#99f6e4"/>
      <text x="42" y="245" fill="#115e59">Foundation post-call hooks</text>
      <text x="165" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">sync and async hooks supported</text>
    </g>
  </g>

  <path d="M780 261h45" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(845 108)">
    <rect width="300" height="306" rx="18" fill="#fff" opacity=".97"/>
    <circle cx="40" cy="40" r="22" fill="#64748b"/>
    <text x="40" y="47" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="800" fill="#fff">3</text>
    <text x="75" y="47" font-family="Inter,Segoe UI,sans-serif" font-size="21" font-weight="750" fill="#334155">Shutdown</text>
    <text x="24" y="83" font-family="Inter,Segoe UI,sans-serif" font-size="13" fill="#64748b">Release resources in a predictable order.</text>

    <g font-family="Inter,Segoe UI,sans-serif" font-size="14">
      <rect x="24" y="108" width="252" height="38" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="42" y="133" fill="#475569">External pre-shutdown</text>
      <path d="M150 146v15" stroke="#94a3b8" marker-end="url(#arrow)"/>
      <rect x="24" y="164" width="252" height="38" rx="9" fill="#f0fdfa" stroke="#99f6e4"/>
      <text x="42" y="189" fill="#115e59">Foundation pre-shutdown</text>
      <path d="M150 202v15" stroke="#94a3b8" marker-end="url(#arrow)"/>
      <rect x="24" y="220" width="252" height="38" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="42" y="245" fill="#475569">Endpoint shutdown</text>
      <path d="M150 258v15" stroke="#94a3b8" marker-end="url(#arrow)"/>
      <text x="150" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">then post-shutdown hooks</text>
    </g>
  </g>

  <g transform="translate(352 444)">
    <rect width="496" height="34" rx="17" fill="#174955"/>
    <text x="248" y="22" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="650" fill="#ccfbf1">ML models | database sessions | authentication | caches | messaging</text>
  </g>
</svg>
