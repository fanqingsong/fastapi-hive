# Example application settings. Paths are relative to this file.
# Environment variables with the HIVE_ prefix override this file.
# Paths next to main.py named cornerstone(s)/ and endpoints/ are discovered
# automatically when these keys are omitted.

hive:
  api_prefix: /api
  cornerstone_package_path: ./cornerstone
  endpoint_package_paths:
    - ./endpoints_package1
    - ./endpoints_package2
  # Global automatic mounting stays on. manual_mount opts out with mount=False.
  router_mount_automated: true
  hide_endpoint_container_in_api: true
  hide_endpoint_in_api: false
  hide_endpoint_in_tag: true
  # Profiles gate @cornerstone / @endpoint / @conditional(profiles=...).
  active_profiles:
    - demo
  # Dotted keys read by enabled_when.
  features:
    db: true
    audit: true
  autoconfigure:
    enabled: true
    # Same loader as a hive.autoconfigure entry point. The class lives outside
    # the scanned packages, so it is loaded only through this list.
    imports:
      - example.starters.imported_auto:ImportedAuto
    # showcase.skipped is scanned, then dropped by name.
    exclude:
      - showcase.skipped
